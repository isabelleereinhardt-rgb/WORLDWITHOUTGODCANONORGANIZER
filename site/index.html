<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Beep Beep Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Lora&family=Cormorant+Garamond&family=Cormorant&family=Playfair+Display&family=EB+Garamond&family=Crimson+Text&family=Crimson+Pro&family=Libre+Baskerville&family=Merriweather&family=Spectral&family=Vollkorn&family=Source+Serif+4&family=PT+Serif&family=Bitter&family=Domine&family=Alegreya&family=Cardo&family=Marcellus&family=Cinzel&family=Cinzel+Decorative&family=Diplomata+SC&family=Almendra&family=IM+Fell+English&family=Old+Standard+TT&family=Abril+Fatface&family=Josefin+Sans&family=Raleway&family=Montserrat&family=Poppins&family=Nunito&family=Quicksand&family=Work+Sans&family=Karla&family=Space+Grotesk&family=Jost&display=swap">
<link rel="stylesheet" href="css/app.css?v=20260725m">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M10 3.2l1.6 4.8 4.8 1.6-4.8 1.6L10 16l-1.6-4.8L3.6 9.6l4.8-1.6z' fill='%237c5cff'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="loading">
  <!-- Top bar -->
  <header class="topbar">
    <button id="sidebarToggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 4.5C4 4 4.4 3.6 5 3.6h4V16H5c-.6 0-1 .4-1 1V4.5z"/><path d="M16 4.5C16 4 15.6 3.6 15 3.6h-4V16h4c.6 0 1 .4 1 1V4.5z"/></svg>
      </span>
      <span class="brand-text">Beep Beep Organizer<small>World Without God</small></span>
    </a>
    <button id="wsSwitchOpen" class="icon-btn" title="Switch workspace">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="10.5" y="3.5" width="6" height="6" rx="1"/><rect x="3.5" y="10.5" width="6" height="6" rx="1"/><rect x="10.5" y="10.5" width="6" height="6" rx="1"/></svg>
      <span class="st-label">Workspaces</span>
    </button>
    <button id="searchOpen" class="search-trigger" title="Search (Ctrl+K)">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5"/><path d="M16 16l-3.2-3.2"/></svg>
      <span class="st-label">Search everything…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="topbar-right">
      <button id="exportOpen" class="icon-btn" title="Export">Export</button>
      <button id="assistantToggle" class="icon-btn accent" title="Canon Assistant">✦ Assistant</button>
      <button id="themeToggle" class="icon-btn" title="Toggle light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15.5 11.5A6 6 0 0 1 8.5 4.5a6 6 0 1 0 7 7z"/></svg>
      </button>
    </div>
  </header>

  <!-- Export menu -->
  <div class="export-menu" id="exportMenu" hidden>
    <div class="export-box">
      <div class="export-title">Export</div>
      <div class="export-row">
        <span>This page</span>
        <select id="exportOrientation"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select>
        <button class="btn sm" id="exportPagePrint">Print / Save as PDF</button>
      </div>
      <div class="export-row">
        <span>Entire site</span>
        <button class="btn ghost sm" id="exportSiteJson">Download full backup (.json)</button>
      </div>
      <button class="btn ghost sm" id="exportClose" style="margin-top:10px;width:100%">Close</button>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <nav id="nav"></nav>
  </aside>

  <!-- Main -->
  <main class="main" id="view"></main>

  <!-- Assistant panel -->
  <aside class="assistant" id="assistant" hidden>
    <div class="assistant-head">
      <strong>✦ Canon Assistant</strong>
      <button class="icon-btn" id="assistantClose" title="Close">✕</button>
    </div>
    <p class="assistant-sub">Your canon, at your fingertips. Type <b>/</b> for commands, ask a question in plain words, or look up a name. Press <b>Enter</b> to send.</p>
    <div class="assistant-input-wrap">
      <input id="assistantInput" class="assistant-input" placeholder="Type / for commands, or ask anything…" autocomplete="off" spellcheck="false">
      <div class="cmd-menu" id="assistCmdMenu" hidden></div>
    </div>
    <div class="assistant-body" id="assistantBody"></div>
  </aside>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-box">
      <input id="searchInput" placeholder="Search characters, houses, places, lore…" autocomplete="off">
      <div class="search-hint">Type to search · <kbd>Enter</kbd> for full results · <kbd>Esc</kbd> to close</div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</div>

<script src="data/db.js?v=20260725m"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script>if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";</script>
<script src="js/store.js?v=20260725m"></script>
<script src="js/workspaces.js?v=20260725m"></script>
<script src="js/folders.js?v=20260725m"></script>
<script src="js/features.js?v=20260725m"></script>
<script src="js/app.js?v=20260725m"></script>
<script src="js/editor.js?v=20260725m"></script>
<script src="js/canvas.js?v=20260725m"></script>
<script src="js/mindmap.js?v=20260725m"></script>
<script src="js/sheets.js?v=20260725m"></script>
<script src="js/study.js?v=20260725m"></script>
<script src="js/timeline.js?v=20260725m"></script>
</body>
</html>
