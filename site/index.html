<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23241b1e%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2225%22%20fill%3D%22none%22%20stroke%3D%22%23c9a15c%22%20stroke-width%3D%222.6%22%2F%3E%3Cg%20font-family%3D%22Georgia%2Cserif%22%20font-style%3D%22italic%22%20font-weight%3D%22600%22%20font-size%3D%2227%22%20fill%3D%22%23f6ccd5%22%3E%3Ctext%20x%3D%2233%22%20y%3D%2241%22%3EB%3C%2Ftext%3E%3Ctext%20x%3D%2233%22%20y%3D%2241%22%20transform%3D%22translate%2866%2C0%29%20scale%28-1%2C1%29%22%3EB%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fsvg%3E">
</head>
<body>
<div id="app" class="loading">
  <!-- Top bar -->
  <header class="topbar">
    <button id="sidebarToggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark bbo-mark"><span class="bb"><i class="flip">B</i><i>B</i></span></span>
      <span class="brand-text">Beep Beep Organizer<small>World Without God</small></span>
    </a>
    <button id="wsSwitchOpen" class="icon-btn" title="Switch workspace">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="10.5" y="3.5" width="6" height="6" rx="1"/><rect x="3.5" y="10.5" width="6" height="6" rx="1"/><rect x="10.5" y="10.5" width="6" height="6" rx="1"/></svg>
      <span class="st-label">Workspaces</span>
    </button>
    <a id="spaceOpen" class="icon-btn space-btn" href="#/space" title="Publishing, readers and comments">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c1.8 2 2.8 4.4 2.8 7s-1 5-2.8 7c-1.8-2-2.8-4.4-2.8-7s1-5 2.8-7z"/></svg>
      <span class="st-label">Community Space</span>
    </a>
    <button id="searchOpen" class="search-trigger" title="Search (Ctrl+K)">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5"/><path d="M16 16l-3.2-3.2"/></svg>
      <span class="st-label">Search everything…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="topbar-right">
      <button id="exportOpen" class="icon-btn" title="Export">Export</button>
      <button id="assistantToggle" class="icon-btn accent" title="Canon Assistant">✦ Assistant</button>
      <span id="accountChip" class="account-chip"></span>
      <button id="themeToggle" class="icon-btn" title="Toggle light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15.5 11.5A6 6 0 0 1 8.5 4.5a6 6 0 1 0 7 7z"/></svg>
      </button>
    </div>
  </header>

  <!-- Export menu -->
  <div class="export-menu" id="exportMenu" hidden>
    <div class="export-box">
      <div class="export-title">Export</div>
      <div class="export-row">
        <span>This page</span>
        <select id="exportOrientation"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select>
        <button class="btn sm" id="exportPagePrint">Print / Save as PDF</button>
      </div>
      <div class="export-row">
        <span>Entire site</span>
        <button class="btn ghost sm" id="exportSiteJson">Download full backup (.json)</button>
      </div>
      <button class="btn ghost sm" id="exportClose" style="margin-top:10px;width:100%">Close</button>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <nav id="nav"></nav>
  </aside>

  <!-- Main -->
  <main class="main" id="view"></main>

  <!-- Assistant panel -->
  <aside class="assistant" id="assistant" hidden>
    <div class="assistant-head">
      <span class="ah-who">
        <span class="ah-face" id="assistantFace" data-lucky-face="30"></span>
        <span class="ah-name" id="assistantName">Lucky</span>
      </span>
      <span class="ah-tools">
        <button class="ah-tool" id="assistantNew" title="New thread" aria-label="New thread">＋</button>
        <button class="ah-tool" id="assistantHistory" title="Recent lookups" aria-label="Recent lookups">⌛</button>
        <button class="ah-tool" id="assistantClose" title="Close" aria-label="Close">✕</button>
      </span>
    </div>
    <div class="assistant-chips">
      <span class="a-chip model" id="assistantModel" title="Answers are worked out in this browser from your own entries. Nothing is sent anywhere."><span class="dot"></span><span id="assistantModelName">On device</span></span>
      <button class="a-chip" id="assistantScope" title="What the assistant is allowed to read">Canon + notes ▾</button>
      <button class="a-chip" id="assistantLength" title="How long answers should be">Brief ▾</button>
    </div>
    <div class="assistant-context" id="assistantContext" hidden></div>
    <div class="assistant-ask">
      <span class="aa-glyph">✧</span>
      <input id="assistantInput" placeholder="Ask, compare, teach me a fact, or type / for commands" autocomplete="off">
      <button class="aa-dictate" id="assistantDictate" title="Dictate">✧ Dictate</button>
    </div>
    <div class="assistant-commands" id="assistantCommands" hidden></div>
    <div class="assistant-body" id="assistantBody"></div>
  </aside>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-box">
      <div class="search-bar">
        <span class="sb-glyph">⌕</span>
        <input id="searchInput" placeholder="Search the canon…" autocomplete="off">
        <button class="sb-esc" id="searchEsc">Esc</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</div>

</body>
</html>
